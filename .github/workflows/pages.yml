name: Publish landing

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Новый прогон отменяет предыдущий: зависший раннер не блокирует очередь
concurrency:
  group: publish
  cancel-in-progress: true

jobs:
  publish:
    name: Сборка и публикация в gh-pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Подготовить статику
        run: |
          mkdir -p _site
          rsync -a --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='src' \
            --exclude='scripts' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            --exclude='README.md' \
            --exclude='session-*.md' \
            ./_site/

      - name: Пересобрать CSS (если npm доступен)
        continue-on-error: true
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Проверить сборку
        run: |
          test -f _site/index.html || { echo "::error::нет _site/index.html"; exit 1; }
          test -f _site/assets/css/site.css || { echo "::error::нет _site/assets/css/site.css — выполните npm run build"; exit 1; }
          test -f _site/sitemap.xml || { echo "::error::нет _site/sitemap.xml"; exit 1; }

      # GitHub Pages в этом репозитории настроен на источник «ветка gh-pages»,
      # поэтому сайт публикуется именно отсюда.
      - name: Опубликовать в gh-pages
        run: |
          cd _site
          git init -q
          git checkout -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Deploy ${GITHUB_SHA}"
          git push -q --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            gh-pages
